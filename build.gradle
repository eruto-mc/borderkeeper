plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.5.2'
group = 'net.erutobusiness'
base { archivesName = 'borderkeeper' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    // MOD の依存を取る maven。手元に jar を置かずに済ませるため（2026-08-07 の方針）
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // ⚠ 実行時は同梱しない（利用者が入れている本体に当てる）。
    //    版は当部が実際に置いているものと同じ 1.3.146。
    compileOnly "maven.modrinth:chunky:1.3.146"
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'borderkeeper',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Border Keeper',
            'Implementation-Version': project.version
        ])
    }
}
